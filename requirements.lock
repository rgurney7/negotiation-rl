# Dependency lock for negotiation-rl.
# Source of truth: the 2026-06-29 RunPod A40 preview that ran SFT, GRPO, and PPO end-to-end
# (Python 3.12, CUDA 12.9). The unpinned pyproject.toml resolves to mutually-incompatible
# bleeding edge — PIN. The load-bearing packages below are the exact versions that WORKED.
#
# Install:  pip install --no-build-isolation -r requirements.lock --break-system-packages
#           (or via uv:  uv pip install --break-system-packages -r requirements.lock)
#
# ── VERIFIED STACK — torch 2.9.1 — reproduces SFT + GRPO + PPO ─────────────────────────
# These five are the tight-coupling set; force them exactly. transformers 5.12+ breaks
# unsloth (auto_docstring); 5.5.0 is unsloth 2026.6.9's documented cap. xformers 0.0.33.post2
# is the torch-2.9 build. torch 2.9.x is required (torch.int1; older torch fails to import
# transformers). Base image used: runpod/pytorch:1.0.7-cu1290-torch291-ubuntu2404.
torch==2.9.1
unsloth==2026.6.9
unsloth-zoo==2026.6.7
transformers==5.5.0
xformers==0.0.33.post2
peft==0.19.1
# supporting (versions observed in the verified run; loosen only if needed)
