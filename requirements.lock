python-dotenv
#
# ── PERF: Qwen3.5 linear-attention fast kernels (BOX-VERIFY versions) ──────────────────
# Qwen3.5-4B's hybrid GatedDeltaNet layers fall back to slow torch ops WITHOUT these two CUDA
# kernels — the preview logs showed "fast path is not available ... falling back to torch
# implementation" on every run. They need --no-build-isolation (already in the install cmd above).
# Versions left UNPINNED until the pilot box-verifies import + a 3-update A/B confirms the speedup
# against torch 2.9.1 (a kernel can install yet still mismatch torch and silently fall back). After
# that A/B, pin the exact working versions here and set require_fast_kernels=True for the final run.
causal-conv1d            # imports as `causal_conv1d`
flash-linear-attention   # imports as `fla`
#
# ── vLLM: intentionally NOT used ──────────────────────────────────────────────────────
# PPO rolls out with batched HF `.generate`, not vLLM. This is a deliberate simplification
# (2026-06-29): it keeps all three methods on the single verified torch-2.9.1 stack above
# (vLLM 0.23 would force the whole stack to torch 2.10), gives one generation path to reason
# about, drops the LoRA->vLLM weight-sync staleness risk, and matches the reference repo,
# which also used plain HF generation. Do NOT re-add vLLM without re-opening that trade.
